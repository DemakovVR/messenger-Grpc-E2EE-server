syntax = "proto3";

package auth;

option go_package = "gen/auth;auth";

import "google/api/annotations.proto";

service AuthService {

  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/auth/register"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/auth/login"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
}

service UserService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (Empty);
  rpc UpdatePublicKey(UpdatePublicKeyRequest) returns (Empty);
  rpc DeleteAccount(Empty) returns (Empty);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  string user_id = 1;
  string message = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message UpdateProfileRequest {
  string username = 1;
  string email = 2;
}

message UpdatePublicKeyRequest {
  string public_key = 1;
}

message GetProfileRequest {}

message GetProfileResponse {
  string id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
}

message Empty {}