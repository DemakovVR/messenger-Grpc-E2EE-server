syntax = "proto3";

package audit;

option go_package = "gen/audit;auditpb";

import "google/api/annotations.proto";

service AuditService {
  rpc GetUserLogs(GetUserLogsRequest) returns (GetUserLogsResponse) {
    option (google.api.http) = {
      get: "/api/audit/user/{user_id}"
    };
  }
  
  rpc GetChatLogs(GetChatLogsRequest) returns (GetChatLogsResponse) {
    option (google.api.http) = {
      get: "/api/audit/chat/{chat_id}"
    };
  }
}

message GetUserLogsRequest {
  string user_id = 1;
}

message GetChatLogsRequest {
  string chat_id = 1;
}

message AuditLog {
  string id = 1;
  string user_id = 2;
  string chat_id = 3;
  string action = 4;
  string details = 5;
  string created_at = 6;
  string actor_username = 7;
}

message GetUserLogsResponse {
  repeated AuditLog logs = 1;
}

message GetChatLogsResponse {
  repeated AuditLog logs = 1;
}