syntax = "proto3";

package chat;

option go_package = "gen/chat;chat";

import "google/api/annotations.proto";

service ChatService {
  rpc CreatePrivateChat(CreatePrivateChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/api/chats/private"
      body: "*"
    };
  }
  
  rpc CreateGroupChat(CreateGroupChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/api/chats/group"
      body: "*"
    };
  }
  
  rpc GetChats(GetChatsRequest) returns (GetChatsResponse) {
    option (google.api.http) = {
      get: "/api/chats"
    };
  }
  
  rpc GetChat(GetChatRequest) returns (GetChatResponse) {
    option (google.api.http) = {
      get: "/api/chats/{chat_id}"
    };
  }
  
  rpc DeleteChat(DeleteChatRequest) returns (Empty) {
    option (google.api.http) = {
      delete: "/api/chats/{chat_id}"
    };
  }
  
  rpc AddParticipants(AddParticipantsRequest) returns (Empty) {
    option (google.api.http) = {
      post: "/api/chats/{chat_id}/participants"
      body: "*"
    };
  }
  
  rpc RemoveParticipants(RemoveParticipantsRequest) returns (Empty) {
    option (google.api.http) = {
      post: "/api/chats/{chat_id}/participants/remove"
      body: "*"
    };
  }
  
  rpc LeaveGroup(LeaveGroupRequest) returns (Empty) {
    option (google.api.http) = {
      post: "/api/chats/{chat_id}/leave"
      body: "*"
    };
  }
}

message CreatePrivateChatRequest {
  string user_id = 1;
}

message CreateGroupChatRequest {
  string name = 1;
  repeated string participant_ids = 2;
  string created_by = 3;
}

message CreateChatResponse {
  string chat_id = 1;
  bool is_existing = 2;
}

message GetChatsRequest {}

message GetChatsResponse {
  repeated Chat chats = 1;
}

message GetChatRequest {
  string chat_id = 1;
}

message GetChatResponse {
  Chat chat = 1;
}

message Chat {
  string id = 1;
  string type = 2;
  string name = 3;
  repeated Participant participants = 4;
  string created_at = 5;
  string updated_at = 6;
  string created_by = 7;
}

message Participant {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
}

message DeleteChatRequest {
  string chat_id = 1;
}

message AddParticipantsRequest {
  string chat_id = 1;
  repeated string user_ids = 2;
}

message RemoveParticipantsRequest {
  string chat_id = 1;
  repeated string user_ids = 2;
}

message LeaveGroupRequest {
  string chat_id = 1;
}

message Empty {}