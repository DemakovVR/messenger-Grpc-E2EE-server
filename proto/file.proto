syntax = "proto3";

package file;

option go_package = "gen/file;file";

import "google/api/annotations.proto";

service FileService {
    rpc UploadFile(stream UploadFileRequest)
        returns (UploadFileResponse) {
        option (google.api.http) = {
            post: "/api/files/upload"
            body: "*"
        };
    }

    rpc DownloadFile(DownloadFileRequest)
        returns (stream DownloadFileResponse) {
        option (google.api.http) = {
            get: "/api/files/download/{file_url}"
        };
    }
}

message UploadFileRequest {
    string file_name = 1;
    bytes chunk = 2;
}

message UploadFileResponse {
    string file_url = 1;
}

message DownloadFileRequest {
    string file_url = 1;
}

message DownloadFileResponse {
    bytes chunk = 1;
}