syntax = "proto3";

package message;

option go_package = "gen/message";

service MessageService {
    rpc SendMessage(SendMessageRequest)
        returns (SendMessageResponse);

    rpc GetMessages(GetMessagesRequest)
        returns (GetMessagesResponse);

    rpc ConnectMessages(ConnectRequest)
        returns (stream MessageResponse);

    rpc DeleteMessage(DeleteMessageRequest)
        returns (Empty);
    rpc EditMessage(EditMessageRequest)
        returns (Empty);
}

message ConnectRequest {}

message SendMessageRequest {
    string chat_id = 1;
    string encrypted_content = 2;
}

message SendMessageResponse {
    string message_id = 1;
}

message GetMessagesRequest {
    string chat_id = 1;
}

message MessageResponse {
    string id = 1;
    string chat_id = 2;
    string sender_id = 3;
    string encrypted_content = 4;
    string sent_at = 5;
}

message GetMessagesResponse {
    repeated MessageResponse messages = 1;
}

message DeleteMessageRequest {
    string message_id = 1;
}

message EditMessageRequest {
    string message_id = 1;
    string encrypted_content = 2;
}

message Empty {}
