syntax = "proto3";

package message;

option go_package = "gen/message";

import "google/api/annotations.proto";

service MessageService {
    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
        option (google.api.http) = {
            post: "/api/messages"
            body: "*"
        };
    }

    rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse) {
        option (google.api.http) = {
            get: "/api/chats/{chat_id}/messages"
        };
    }

    rpc ConnectMessages(ConnectRequest) returns (stream MessageResponse);

    rpc DeleteMessage(DeleteMessageRequest) returns (Empty) {
        option (google.api.http) = {
            delete: "/api/messages/{message_id}"
        };
    }

    rpc EditMessage(EditMessageRequest) returns (Empty) {
        option (google.api.http) = {
            put: "/api/messages/{message_id}"
            body: "*"
        };
    }
}

message ConnectRequest {}

message SendMessageRequest {
    string chat_id = 1;
    string encrypted_content = 2;
    bool is_encrypted = 3;
    string reply_to_message_id = 4;
}

message SendMessageResponse {
    string message_id = 1;
}

message GetMessagesRequest {
    string chat_id = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message MessageResponse {
    string id = 1;
    string chat_id = 2;
    string sender_id = 3;
    string encrypted_content = 4;
    bool is_encrypted = 5;
    string sent_at = 6;
    string created_at = 7;
    bool is_edited = 8;
    bool is_deleted = 9;
    MessageResponse reply_to = 10;
}

message GetMessagesResponse {
    repeated MessageResponse messages = 1;
}

message DeleteMessageRequest {
    string message_id = 1;
}

message EditMessageRequest {
    string message_id = 1;
    string encrypted_content = 2;
    bool is_encrypted = 3;
}

message Empty {}