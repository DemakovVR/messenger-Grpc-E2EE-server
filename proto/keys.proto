syntax = "proto3";

package keys;

option go_package = "gen/keys;keyspb";

import "google/api/annotations.proto";

service KeyService {
  rpc UploadKeys(UploadKeysRequest) returns (Empty) {
    option (google.api.http) = {
      post: "/api/keys/publish"
      body: "*"
    };
  }
  
  rpc GetPreKeyBundle(GetPreKeyBundleRequest) returns (PreKeyBundle) {
    option (google.api.http) = {
      get: "/api/keys/user/{user_id}"
    };
  }
  
  rpc UploadOneTimeKeys(UploadOneTimeKeysRequest) returns (Empty) {
    option (google.api.http) = {
      post: "/api/keys/one-time"
      body: "*"
    };
  }
  
  rpc RotateSignedPreKey(RotateSignedPreKeyRequest) returns (Empty) {
    option (google.api.http) = {
      post: "/api/keys/rotate"
      body: "*"
    };
  }
}

message Empty {}

message UploadKeysRequest {
  string device_id = 1;
  string identity_key_public = 2;
  string signed_prekey_public = 3;
  string signed_prekey_signature = 4;
}

message GetPreKeyBundleRequest {
  string user_id = 1;
}

message PreKeyBundle {
  string user_id = 1;
  string device_id = 2;
  string identity_key_public = 3;
  string signed_prekey_public = 4;
  string signed_prekey_signature = 5;
  string one_time_prekey = 6;
  int32 one_time_prekey_id = 7;
}

message OneTimeKey {
  int32 key_id = 1;
  string public_key = 2;
}

message UploadOneTimeKeysRequest {
  string device_key_id = 1;
  repeated OneTimeKey keys = 2;
}

message RotateSignedPreKeyRequest {
  string device_id = 1;
  string signed_prekey_public = 2;
  string signed_prekey_signature = 3;
}